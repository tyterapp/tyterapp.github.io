name: Publish Tyter MVP
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - uses: actions/configure-pages@v5
      - run: npm run site:github
        env:
          TYTER_PRO_CODES: ${{ secrets.TYTER_PRO_CODES }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages
      - uses: actions/deploy-pages@v4
        id: deploy
